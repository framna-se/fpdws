<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six Hours Stage 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F6F6F3; --surface: #FFFFFF; --surface-2: #EDEEEA;
    --ink: #1B1C1A; --ink-2: #4A4C48; --muted: #767871; --line: #D8DAD4;
    --accent: #2C5C86; --accent-ink: #FFFFFF; --accent-soft: #E3ECF4;
    --hidden: #8A4B1F; --hidden-soft: #F6E9DD;
    --focus: #2C5C86; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161718; --surface: #1F2123; --surface-2: #26282B;
      --ink: #ECEBE6; --ink-2: #C9C8C1; --muted: #9A9B94; --line: #35383C;
      --accent: #86B0D9; --accent-ink: #0F1A25; --accent-soft: #22313F;
      --hidden: #E0A570; --hidden-soft: #3A2A1C;
      --focus: #86B0D9; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161718; --surface: #1F2123; --surface-2: #26282B;
    --ink: #ECEBE6; --ink-2: #C9C8C1; --muted: #9A9B94; --line: #35383C;
    --accent: #86B0D9; --accent-ink: #0F1A25; --accent-soft: #22313F;
    --hidden: #E0A570; --hidden-soft: #3A2A1C;
    --focus: #86B0D9; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 40rem; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
  .mono, .eyebrow, .meta { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header.top { display: grid; gap: 10px; margin-bottom: 36px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  .lede { color: var(--ink-2); font-size: 18px; margin: 0; text-wrap: pretty; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  section { margin-bottom: 40px; }
  h2 { font-size: 22px; line-height: 1.2; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.005em; text-wrap: balance; }
  p { margin: 0 0 12px; text-wrap: pretty; }
  p:last-child { margin-bottom: 0; }
  .note { color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; overflow: hidden; }
  .card-head { padding: 12px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; color: var(--muted); }
  .card-head strong { color: var(--ink); font-weight: 500; }
  .card-body { padding: 18px; }
  .card-body p { margin-bottom: 14px; }
  .card-body p:last-child { margin-bottom: 0; }
  blockquote.brief { margin: 0; font-size: 19px; line-height: 1.5; }
  ol.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; gap: 14px; }
  ol.steps li { counter-increment: step; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
  ol.steps li::before {
    content: counter(step); font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 500; width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 50%; background: var(--accent); color: var(--accent-ink); margin-top: 2px;
  }
  ol.steps strong { font-weight: 600; }
  .roles { display: grid; gap: 12px; }
  .role { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .role h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .role p { color: var(--ink-2); font-size: 16px; }
  @media (min-width: 600px) { .wrap { padding-block: 48px 64px; } h1 { font-size: 40px; } .roles { grid-template-columns: 1fr 1fr; } }

  .question { font-size: 22px; line-height: 1.35; font-weight: 600; margin: 0; letter-spacing: -0.005em; text-wrap: balance; }
  ul.cons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.cons li {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
    min-height: 52px; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface);
    transition: background 150ms ease, border-color 150ms ease;
  }
  ul.cons .k { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; color: var(--muted); }
  ul.cons li.drawn { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  ul.cons li.drawn .k { color: var(--accent); }
  .drawrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  #draw {
    min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg);
    font: inherit; font-weight: 500; font-size: 15px; cursor: pointer;
  }
  #draw:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .drawrow .note { font-size: 15px; margin: 0; }
  .prompt { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 16px 18px; }
  .prompt .label { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .prompt p { font-size: 18px; line-height: 1.5; }
  .output { display: grid; gap: 10px; }
  .output .row { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 12px 14px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
  .output .row b { font-weight: 600; }
  .output .row span { color: var(--ink-2); font-size: 15px; }
  .locked { border: 1px dashed var(--line); border-radius: 6px; padding: 14px 16px; color: var(--muted); font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { ul.cons li { transition: none; } }

  .big p { font-size: 24px; line-height: 1.4; font-weight: 500; }
  @media (min-width: 900px) { .wrap { max-width: 52rem; } h1 { font-size: 56px; } .big p { font-size: 36px; } .prompt .label { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Workshop 3 · The six hours</div>
    <h1>Stage 2</h1>
  </header>
  <div class="prompt big">
    <div class="label">3 minutes · In pairs</div>
    <p>Now cross off everything on your list that is just more of what you already do. Read out what's left.</p>
  </div>
</div>
</body>
</html>
